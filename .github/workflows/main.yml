name: Fluent Plus

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install
        run: npm install -g luabundler

      - name: Run
        run: |
          mkdir -p dist
          luabundler bundle src/entry.lua -o dist/bundle.lua -p "src/?.lua"

      - name: Save Result
        uses: actions/upload-artifact@v4
        with:
          name: fluent-plus
          path: dist/bundle.lua
