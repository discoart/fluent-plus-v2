name: Fluent Plus

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install
        run: npm install -g luabundler

      - name: Run
        run: |
          mkdir -p dist
          luabundler bundle src/entry.lua -o dist/bundle.lua -p "src/?.lua"

      - name: Upload
        uses: softprops/action-gh-release@v2
        with:
          files: dist/bundle.lua
