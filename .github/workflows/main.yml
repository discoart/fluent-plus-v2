name: Fluent Plus

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set channel and filename
        id: vars
        run: |
          TAG="${{ github.ref_name }}"
          if echo "$TAG" | grep -qi beta; then
            echo "channel=beta" >> $GITHUB_OUTPUT
            echo "fname=beta.lua" >> $GITHUB_OUTPUT
          else
            echo "channel=stable" >> $GITHUB_OUTPUT
            echo "fname=stable.lua" >> $GITHUB_OUTPUT
          fi

      - name: Run
        run: |
          node bundler.js src/entry.lua "dist/${{ steps.vars.outputs.fname }}" ${{ github.ref_name }}

      - name: Upload
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ steps.vars.outputs.fname }}
