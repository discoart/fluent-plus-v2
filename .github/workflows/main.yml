name: Fluent Plus

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set channel, version, filename
        id: vars
        run: |
          TAG="${{ github.ref_name }}"
          TITLE="${{ github.event.release.name }}"
          VER=$(echo "$TITLE" | grep -oE 'v[0-9]+\.[0-9]+\.[0-9]+' || echo "v0.0.0")
          if echo "$TAG" | grep -qi beta; then
            echo "channel=beta" >> $GITHUB_OUTPUT
            echo "fname=beta.lua" >> $GITHUB_OUTPUT
          else
            echo "channel=stable" >> $GITHUB_OUTPUT
            echo "fname=stable.lua" >> $GITHUB_OUTPUT
          fi
          echo "version=$VER" >> $GITHUB_OUTPUT

      - name: Run
        run: |
          node bundler.js src/entry.lua "dist/${{ steps.vars.outputs.fname }}" ${{ steps.vars.outputs.version }} ${{ steps.vars.outputs.channel }}

      - name: Upload
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ steps.vars.outputs.fname }}
